# Xcode project for the pplz apps. The project file itself is generated and not committed:
#   cd App && xcodegen generate
name: pplz
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  pplz:
    path: ..
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tillg.pplz
    PRODUCT_NAME: pplz
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  pplzMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    dependencies:
      - package: pplz
        product: PplzUI
      - target: pplzShareMac
    settings:
      base:
        # No sandbox and no hardened runtime yet: the app shares its store with the CLI and
        # scripts the Contacts app. Both change when iCloud sync and the notes entitlement arrive.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Mac/pplz.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.tillg.pplz]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
        # shared with the Mac share extension; a team-prefixed group needs no provisioning on the Mac
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.tillg.pplz]
    info:
      path: Mac/Info.plist
      properties:
        PplzAppGroup: $(TeamIdentifierPrefix)com.tillg.pplz
        CFBundleDisplayName: pplz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSContactsUsageDescription: "pplz shows your contacts and adds a history of your meetings and calls to each contact's notes. Your own notes stay unchanged, and pplz does not share them with anyone."
        NSAppleEventsUsageDescription: "pplz asks the Contacts app to show a person's card and to add what you record in pplz."
        NSCalendarsFullAccessUsageDescription: "pplz offers your current and recent calendar entries when you record whom you met."
        CFBundleURLTypes:
          - CFBundleURLName: com.tillg.pplz
            CFBundleURLSchemes: [pplz]
  pplziOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: pplz
        product: PplzUI
      - target: pplzShare
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: iOS/pplz.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.tillg.pplz]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # shared with the share extension: the inbox for captured screenshots and links
        com.apple.security.application-groups: [group.com.tillg.pplz]
    info:
      path: iOS/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: pplz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSContactsUsageDescription: "pplz shows your contacts and adds a history of your meetings and calls to each contact's notes. Your own notes stay unchanged, and pplz does not share them with anyone."
        NSCalendarsFullAccessUsageDescription: "pplz offers your current and recent calendar entries when you record whom you met."
        CFBundleURLTypes:
          - CFBundleURLName: com.tillg.pplz
            CFBundleURLSchemes: [pplz]
  # "Share → pplz" for a screenshot or a profile link; hands it to the app through the App Group inbox.
  pplzShare:
    type: app-extension
    platform: iOS
    sources: [Share, ShareCommon]
    dependencies:
      - package: pplz
        product: PplzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tillg.pplz.share
        PRODUCT_NAME: pplzShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: Share/pplzShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tillg.pplz]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: pplz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # The same for the Mac's share menu.
  pplzShareMac:
    type: app-extension
    platform: macOS
    sources: [ShareMac, ShareCommon]
    dependencies:
      - package: pplz
        product: PplzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tillg.pplz.sharemac
        PRODUCT_NAME: pplzShareMac
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: ShareMac/pplzShareMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.tillg.pplz]
    info:
      path: ShareMac/Info.plist
      properties:
        CFBundleDisplayName: pplz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PplzAppGroup: $(TeamIdentifierPrefix)com.tillg.pplz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # Clicks through the iOS app from the command line, see scripts/ui.sh.
  pplzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: pplziOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tillg.pplz.uitests
        PRODUCT_NAME: pplzUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: pplziOS
        CODE_SIGN_STYLE: Automatic
schemes:
  pplzMac:
    build:
      targets:
        pplzMac: all
  pplziOS:
    build:
      targets:
        pplziOS: all
    test:
      targets: [pplzUITests]
