# Xcode project for the cardXchange apps. The project file itself is generated and not committed:
#   cd App && xcodegen generate
name: cardxchange
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  cardxchange:
    path: ..
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: me.cardxchange.app
    PRODUCT_NAME: cardXchange
    MARKETING_VERSION: "0.2"
    # The build number and the build date (issue #12). scripts/build-app.sh and scripts/ui.sh set both:
    # the commit count of HEAD and the local time. A build in Xcode keeps these defaults.
    CURRENT_PROJECT_VERSION: "1"
    CX_BUILD_DATE: ""
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  cardxchangeMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    dependencies:
      - package: cardxchange
        product: CXUI
      - target: cardxchangeShareMac
    settings:
      base:
        # No sandbox and no hardened runtime yet: the app shares its store with the CLI and
        # scripts the Contacts app. Both change when iCloud sync and the notes entitlement arrive.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Mac/cardxchange.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.me.cardxchange.app]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
        # shared with the Mac share extension; a team-prefixed group needs no provisioning on the Mac
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)me.cardxchange.app]
        # the user's own position on the map; needed once the app is sandboxed
        com.apple.security.personal-information.location: true
    info:
      path: Mac/Info.plist
      properties:
        CXAppGroup: $(TeamIdentifierPrefix)me.cardxchange.app
        CFBundleDisplayName: cardXchange
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CXBuildDate: $(CX_BUILD_DATE)
        LSApplicationCategoryType: public.app-category.productivity
        NSContactsUsageDescription: "cardXchange shows your contacts and adds a history of your meetings and calls to each contact's notes. Your own notes stay unchanged, and cardXchange does not share them with anyone."
        NSAppleEventsUsageDescription: "cardXchange asks the Contacts app to show a person's card and to add what you record in cardXchange."
        NSCalendarsFullAccessUsageDescription: "cardXchange offers your current and recent calendar entries when you record whom you met."
        NSLocationWhenInUseUsageDescription: "cardXchange shows where you are on the map, next to the people you know. cardXchange does not store or send your location."
        NSLocationUsageDescription: "cardXchange shows where you are on the map, next to the people you know. cardXchange does not store or send your location."
        CFBundleURLTypes:
          - CFBundleURLName: me.cardxchange.app
            CFBundleURLSchemes: [cx, pplz]
  cardxchangeiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: cardxchange
        product: CXUI
      - target: cardxchangeShare
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: iOS/cardxchange.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.me.cardxchange.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # shared with the share extension: the inbox for captured screenshots and links
        com.apple.security.application-groups: [group.me.cardxchange.app]
    info:
      path: iOS/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: cardXchange
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CXBuildDate: $(CX_BUILD_DATE)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSContactsUsageDescription: "cardXchange shows your contacts and adds a history of your meetings and calls to each contact's notes. Your own notes stay unchanged, and cardXchange does not share them with anyone."
        NSCalendarsFullAccessUsageDescription: "cardXchange offers your current and recent calendar entries when you record whom you met."
        NSCameraUsageDescription: "cardXchange takes a picture of a business card and reads the contact details from it on this device."
        NSLocationWhenInUseUsageDescription: "cardXchange shows where you are on the map, next to the people you know. cardXchange does not store or send your location."
        CFBundleURLTypes:
          - CFBundleURLName: me.cardxchange.app
            CFBundleURLSchemes: [cx, pplz]
  # "Share → cardXchange" for a screenshot or a profile link; hands it to the app through the App Group inbox.
  cardxchangeShare:
    type: app-extension
    platform: iOS
    sources: [Share, ShareCommon]
    dependencies:
      - package: cardxchange
        product: CXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.cardxchange.app.share
        PRODUCT_NAME: cardxchangeShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: Share/cardxchangeShare.entitlements
      properties:
        com.apple.security.application-groups: [group.me.cardxchange.app]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: cardXchange
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CXBuildDate: $(CX_BUILD_DATE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # The same for the Mac's share menu.
  cardxchangeShareMac:
    type: app-extension
    platform: macOS
    sources: [ShareMac, ShareCommon]
    dependencies:
      - package: cardxchange
        product: CXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.cardxchange.app.sharemac
        PRODUCT_NAME: cardxchangeShareMac
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: ShareMac/cardxchangeShareMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)me.cardxchange.app]
    info:
      path: ShareMac/Info.plist
      properties:
        CFBundleDisplayName: cardXchange
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CXBuildDate: $(CX_BUILD_DATE)
        CXAppGroup: $(TeamIdentifierPrefix)me.cardxchange.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # Clicks through the iOS app from the command line, see scripts/ui.sh.
  cardxchangeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: cardxchangeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.cardxchange.app.uitests
        PRODUCT_NAME: cardxchangeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: cardxchangeiOS
        CODE_SIGN_STYLE: Automatic
schemes:
  cardxchangeMac:
    build:
      targets:
        cardxchangeMac: all
  cardxchangeiOS:
    build:
      targets:
        cardxchangeiOS: all
    test:
      targets: [cardxchangeUITests]
